version: "1"

# 1. Managed PostgreSQL Database
databases:
  - name: joineazy-postgres
    plan: free

# 2. Services (Backend & Frontend)
services:
  # Express Backend Web Service
  - type: web
    name: joineazy-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: joineazy-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: "*"

  # Vite React Frontend Static Site
  - type: web
    name: joineazy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: joineazy-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
