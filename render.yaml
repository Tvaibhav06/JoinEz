# Render Blueprint Specification for JoinEz (Full Stack)
# Top-level managed PostgreSQL Database
databases:
  - name: joineazy-postgres
    databaseName: joineazy_db
    user: postgres
    plan: free

# Top-level Services (Backend & Frontend)
services:
  # 1. Express Backend Web Service
  - type: web
    name: joineazy-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: joineazy-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: "*" # Allow frontend requests
    healthCheckPath: /api/health

  # 2. Vite React Frontend Static Site
  - type: static
    name: joineazy-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: joineazy-backend
          envVarKey: RENDER_EXTERNAL_URL
          transform: "${RENDER_EXTERNAL_URL}/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
